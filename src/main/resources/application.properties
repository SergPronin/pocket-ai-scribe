spring.application.name=pocket-ai-scribe
spring.config.import=optional:file:.env[.properties]

# --- SaluteSpeech (STT) ---
sber.auth.key=${SBER_AUTH_KEY}
sber.speech.url=https://smartspeech.sber.ru/rest/v1/speech:recognize
sber.speech.scope=SALUTE_SPEECH_PERS

# --- GigaChat (LLM) ---
sber.gigachat.auth.key=${GIGACHAT_AUTH_KEY}
sber.gigachat.url=https://gigachat.devices.sberbank.ru/api/v1/chat/completions
sber.gigachat.scope=GIGACHAT_API_PERS

# --- ?????????????? ? ???? ---
server.address=0.0.0.0
server.port=8080
obsidian.inbox.path=${OBSIDIAN_INBOX_PATH}